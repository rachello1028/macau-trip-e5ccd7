<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>澳門行程夥伴</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#22579E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="澳門行程">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>*{margin:0}</style>
</head>
<body>
<title>澳門行程夥伴</title>
<style>
:root{
  --bg:#F5F1E8; --surface:#FFFFFF; --surface-2:#FBF8F1;
  --ink:#1C2530; --muted:#5E6B78; --faint:#8A97A3;
  --border:#E6DFD1; --border-strong:#D6CDBB;
  --blue:#22579E; --blue-soft:#E6EEF8; --blue-ink:#1B4680;
  --gold:#B67F1E; --gold-soft:#F6ECD6;
  --green:#2E7D6B; --green-soft:#E1F0EB;
  --coral:#C1573B; --coral-soft:#F7E6DF;
  --danger:#B5443A;
  --shadow:0 1px 2px rgba(28,37,48,.06),0 8px 24px rgba(28,37,48,.07);
  --shadow-sm:0 1px 2px rgba(28,37,48,.08);
  --r:16px; --r-sm:11px;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Songti TC","Noto Serif TC",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Segoe UI",Roboto,sans-serif;
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111621; --surface:#1A212D; --surface-2:#141b26;
    --ink:#E9EDF3; --muted:#9AA7B5; --faint:#6E7C8B;
    --border:#28323F; --border-strong:#36424F;
    --blue:#5B92D6; --blue-soft:#1B2A3F; --blue-ink:#9FC1E8;
    --gold:#DFAE55; --gold-soft:#2C2413;
    --green:#57B49E; --green-soft:#16281F;
    --coral:#DB8265; --coral-soft:#2E1C16;
    --danger:#E0796D;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.4);
    --shadow-sm:0 1px 2px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#111621; --surface:#1A212D; --surface-2:#141b26;
  --ink:#E9EDF3; --muted:#9AA7B5; --faint:#6E7C8B;
  --border:#28323F; --border-strong:#36424F;
  --blue:#5B92D6; --blue-soft:#1B2A3F; --blue-ink:#9FC1E8;
  --gold:#DFAE55; --gold-soft:#2C2413;
  --green:#57B49E; --green-soft:#16281F;
  --coral:#DB8265; --coral-soft:#2E1C16;
  --danger:#E0796D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.4);
  --shadow-sm:0 1px 2px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  font-size:16px; line-height:1.55; letter-spacing:.005em;
  -webkit-font-smoothing:antialiased; padding-bottom:96px;
  overscroll-behavior-y:none;
}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
h1,h2,h3{margin:0;font-weight:700;text-wrap:balance;letter-spacing:-.01em}
.num{font-family:var(--serif);font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:var(--blue);text-decoration:none}

/* ---------- Header ---------- */
header{
  position:sticky;top:0;z-index:40;background:var(--bg);
  border-bottom:1px solid var(--border);
}
.head-top{display:flex;align-items:center;gap:12px;padding:14px 0 10px}
.badge{
  width:46px;height:46px;border-radius:13px;flex:none;
  background:linear-gradient(150deg,var(--blue),var(--blue-ink));
  color:#fff;display:grid;place-items:center;box-shadow:var(--shadow-sm);
  position:relative;overflow:hidden;
}
.badge::after{content:"";position:absolute;inset:0;
  background:
   radial-gradient(circle at 30% 22%,rgba(255,255,255,.35),transparent 42%),
   repeating-linear-gradient(45deg,rgba(255,255,255,.08) 0 4px,transparent 4px 8px);}
.badge span{font-family:var(--serif);font-size:22px;font-weight:700;position:relative}
.head-title{display:flex;flex-direction:column;line-height:1.2}
.head-title b{font-size:19px;letter-spacing:-.02em}
.head-title small{color:var(--muted);font-size:12.5px;letter-spacing:.02em}
.theme-btn{margin-left:auto;width:38px;height:38px;border-radius:10px;
  border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;font-size:17px}

/* live status bar */
.status{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:12px 14px;margin:2px 0 12px;box-shadow:var(--shadow-sm);
  display:flex;align-items:center;gap:12px;
}
.status .dot{width:9px;height:9px;border-radius:50%;background:var(--green);flex:none;
  box-shadow:0 0 0 4px var(--green-soft);animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
.status .s-body{min-width:0;flex:1}
.status .s-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:700}
.status .s-main{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status .s-main span{color:var(--muted);font-weight:400}

/* tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:none;padding:8px 14px;border-radius:999px;font-size:14px;font-weight:600;
  border:1px solid var(--border);background:var(--surface);color:var(--muted);
  white-space:nowrap;transition:all .15s;
}
.tab .d{font-family:var(--serif);margin-right:5px;color:var(--faint);font-size:13px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab[aria-selected="true"] .d{color:var(--bg);opacity:.6}

/* ---------- Day header ---------- */
.day-hero{margin:16px 0 6px}
.day-hero .eyebrow{font-family:var(--serif);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);font-weight:700}
.day-hero h2{font-size:23px;margin-top:3px}
.day-hero p{margin:5px 0 0;color:var(--muted);font-size:13.5px}
.day-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{font-size:12px;font-weight:600;padding:5px 10px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border);color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.chip.spend{background:var(--gold-soft);border-color:transparent;color:var(--gold)}

/* ---------- Timeline ---------- */
.timeline{position:relative;margin:14px 0 0;padding-left:0}
.stop{
  position:relative;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);margin-bottom:10px;box-shadow:var(--shadow-sm);overflow:hidden;
}
.stop.now{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-soft),var(--shadow)}
.stop-main{display:flex;gap:12px;padding:13px 14px;align-items:flex-start}
.stop-time{flex:none;width:52px;text-align:right;padding-top:1px}
.stop-time b{font-family:var(--serif);font-size:15px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stop-time .icon{font-size:15px;margin-top:3px;opacity:.85}
.stop-body{flex:1;min-width:0}
.stop-title{font-size:15.5px;font-weight:650;line-height:1.35}
.stop-note{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.5}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.t{font-size:11px;font-weight:700;padding:2.5px 7px;border-radius:6px;letter-spacing:.02em}
.t.ka{background:var(--coral-soft);color:var(--coral)}
.t.must{background:var(--blue);color:#fff}
.t.book{background:var(--blue-soft);color:var(--blue-ink)}
.t.eat{background:var(--gold-soft);color:var(--gold)}
.t.free{background:var(--green-soft);color:var(--green)}
.est{font-size:12px;color:var(--faint);margin-top:6px;font-variant-numeric:tabular-nums}
.est b{color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums}

/* action row */
.acts{display:flex;gap:7px;padding:0 14px 13px;flex-wrap:wrap}
.act{
  font-size:13px;font-weight:600;padding:8px 12px;border-radius:10px;
  border:1px solid var(--border);background:var(--surface-2);color:var(--ink);
  display:inline-flex;align-items:center;gap:6px;flex:1;justify-content:center;min-width:84px;
}
.act:active{transform:scale(.97)}
.act.nav{background:var(--blue);color:#fff;border-color:var(--blue)}
.act.money{background:var(--gold-soft);color:var(--gold);border-color:transparent}
.act.money.has{background:var(--gold);color:#fff}
.act.ticket{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.act.ticket.booked{background:var(--green);color:#fff;border-color:var(--green)}
.act svg{width:15px;height:15px;flex:none}

.add-free{width:100%;margin-top:2px;padding:12px;border-radius:var(--r);border:1.5px dashed var(--border-strong);background:transparent;color:var(--muted);font-weight:600;font-size:14px}
.add-free:active{background:var(--surface-2)}
.pm{display:inline-block;font-size:11px;font-weight:700;color:var(--blue-ink);background:var(--blue-soft);padding:1px 6px;border-radius:5px;margin-left:6px;vertical-align:middle}
.logged{padding:0 14px 12px;margin-top:-3px}
.logged-row{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;padding:6px 0;border-top:1px dashed var(--border)}
.logged-row span{color:var(--muted)}
.logged-row .amt{font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
.logged-row button{color:var(--danger);font-size:12px;font-weight:600;padding:2px 4px}

/* ---------- Reference cards (guide tab) ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow-sm);margin-bottom:12px;overflow:hidden}
.card-h{padding:14px 15px 10px;display:flex;align-items:center;gap:9px}
.card-h .ic{font-size:19px}
.card-h h3{font-size:16px}
.card-h .sub{font-size:12px;color:var(--muted);font-weight:400;margin-top:1px}
.card-b{padding:0 15px 14px}
.check{display:flex;gap:11px;padding:9px 0;border-top:1px solid var(--border);align-items:flex-start;cursor:pointer}
.check:first-child{border-top:none}
.check input{appearance:none;width:21px;height:21px;border:2px solid var(--border-strong);border-radius:6px;flex:none;margin-top:1px;position:relative;transition:.15s}
.check input:checked{background:var(--green);border-color:var(--green)}
.check input:checked::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(43deg)}
.check .ct{font-size:14px;line-height:1.5}
.check.done .ct{color:var(--faint);text-decoration:line-through}
.check .ct small{display:block;color:var(--muted);font-size:12px;text-decoration:none;margin-top:1px}
.check.done .ct small{color:var(--faint)}

table.mini{width:100%;border-collapse:collapse;font-size:13.5px}
table.mini td{padding:8px 0;border-top:1px solid var(--border);vertical-align:top}
table.mini tr:first-child td{border-top:none}
table.mini td:last-child{text-align:right;font-weight:600;white-space:nowrap;padding-left:10px;color:var(--gold);font-variant-numeric:tabular-nums}
.kv{font-size:13.5px;line-height:1.6}
.kv b{color:var(--blue-ink)}
.callout{background:var(--coral-soft);border-radius:var(--r-sm);padding:11px 13px;font-size:13px;color:var(--coral);margin-top:10px;line-height:1.55}
.callout b{color:var(--coral)}

/* ---------- Reminders tab ---------- */
.rem{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow-sm);margin-bottom:11px;padding:14px 15px}
.rem.flight{border-left:4px solid var(--blue)}
.rem.show{border-left:4px solid var(--coral)}
.rem-top{display:flex;align-items:baseline;gap:8px}
.rem-top h3{font-size:15.5px}
.rem-top .when{margin-left:auto;font-family:var(--serif);font-size:15px;font-variant-numeric:tabular-nums;color:var(--blue-ink)}
.rem-sub{font-size:12.5px;color:var(--muted);margin-top:3px}
.leave{margin-top:11px;background:var(--surface-2);border-radius:var(--r-sm);padding:10px 12px;display:flex;align-items:center;gap:10px}
.leave .lb{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:700}
.leave .lt{font-family:var(--serif);font-size:17px;font-weight:700;color:var(--coral);font-variant-numeric:tabular-nums}
.leave .cd{margin-left:auto;font-size:12px;font-weight:700;color:var(--muted);background:var(--surface);border:1px solid var(--border);padding:4px 9px;border-radius:8px;font-variant-numeric:tabular-nums}
.rem-acts{display:flex;gap:7px;margin-top:11px}
.rem-acts .act{flex:1}

/* booking rows */
.brow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--border)}
.brow:first-child{border-top:none}
.bchk{width:24px;height:24px;flex:none;border-radius:50%;border:2px solid var(--border-strong);background:var(--surface-2);position:relative;transition:.15s}
.bchk[aria-pressed="true"]{background:var(--green);border-color:var(--green)}
.bchk[aria-pressed="true"]::after{content:"";position:absolute;left:7px;top:3px;width:5px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(43deg)}
.binfo{flex:1;min-width:0}
.bname{font-weight:650;font-size:14.5px;line-height:1.3}
.bsub{font-size:12.5px;color:var(--muted);margin-top:2px}
.bright{text-align:right;flex:none}
.bprice{font-weight:700;color:var(--gold);font-size:13.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.blink{font-size:12.5px;font-weight:700;color:var(--blue);margin-top:2px;padding:2px 0}
.brow.done .bname{color:var(--muted)}
.brow.done .bprice{color:var(--faint)}
.t.done{background:var(--green-soft);color:var(--green)}
.tog{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:14px;width:100%;text-align:left}
.tog .tk{width:24px;height:24px;flex:none;border-radius:50%;border:2px solid var(--border-strong);position:relative;transition:.15s}
.tog[aria-pressed="true"]{background:var(--green-soft);border-color:var(--green)}
.tog[aria-pressed="true"] .tk{background:var(--green);border-color:var(--green)}
.tog[aria-pressed="true"] .tk::after{content:"";position:absolute;left:7px;top:3px;width:5px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(43deg)}
.tog .tl{font-weight:650;font-size:14.5px}
.tog .tl small{display:block;font-weight:400;color:var(--muted);font-size:12px}

/* ---------- Bottom summary bar ---------- */
.footbar{
  position:fixed;left:0;right:0;bottom:0;z-index:45;
  background:color-mix(in srgb,var(--surface) 88%,transparent);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border-top:1px solid var(--border);
}
.footbar .wrap{display:flex;align-items:center;gap:14px;padding:11px 16px;
  padding-bottom:calc(11px + env(safe-area-inset-bottom))}
.foot-col{line-height:1.15}
.foot-col .fl{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:700}
.foot-col .fv{font-family:var(--serif);font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.foot-col .fv small{font-size:11px;color:var(--muted);font-family:var(--sans);font-weight:600;margin-left:2px}
.foot-col .fsub{font-size:10px;color:var(--faint);font-weight:600;font-variant-numeric:tabular-nums;margin-top:1px}
.foot-btn{margin-left:auto;background:var(--ink);color:var(--bg);font-weight:650;font-size:13.5px;padding:10px 15px;border-radius:11px;display:inline-flex;gap:6px;align-items:center}

/* ---------- Modal ---------- */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(20,26,34,.5);backdrop-filter:blur(3px);
  display:none;align-items:flex-end;justify-content:center}
.scrim.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:22px 22px 0 0;
  padding:8px 18px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.25);
  animation:up .28s cubic-bezier(.2,.8,.2,1);max-height:88vh;overflow-y:auto}
@keyframes up{from{transform:translateY(100%)}}
.grip{width:38px;height:4px;border-radius:2px;background:var(--border-strong);margin:6px auto 14px}
.sheet h3{font-size:18px;margin-bottom:3px}
.sheet .sh-sub{font-size:13px;color:var(--muted);margin-bottom:16px}
.field{margin-bottom:14px}
.field label{font-size:12px;font-weight:700;letter-spacing:.03em;color:var(--muted);display:block;margin-bottom:6px;text-transform:uppercase}
.cats{display:flex;gap:7px;flex-wrap:wrap}
.cat{padding:8px 13px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);font-size:13.5px;font-weight:600;color:var(--muted)}
.cat[aria-pressed="true"]{background:var(--blue);color:#fff;border-color:var(--blue)}
.amt-in{display:flex;align-items:center;gap:10px;border:1px solid var(--border-strong);border-radius:12px;padding:12px 14px;background:var(--surface-2)}
.amt-in select{border:none;background:none;font-size:15px;font-weight:700;color:var(--ink);font-family:inherit}
.amt-in input{border:none;background:none;font-size:26px;font-weight:700;font-family:var(--serif);width:100%;color:var(--ink);outline:none}
.amt-in input::placeholder{color:var(--faint)}
.txt-in{width:100%;border:1px solid var(--border-strong);border-radius:11px;padding:11px 13px;font-size:14.5px;font-family:inherit;background:var(--surface-2);color:var(--ink);outline:none}
.big-btn{width:100%;background:var(--blue);color:#fff;font-weight:700;font-size:16px;padding:14px;border-radius:13px;margin-top:6px}
.big-btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--border)}
.hint{font-size:12px;color:var(--muted);margin-top:9px;line-height:1.5}
.qr-preview{width:100%;border-radius:12px;margin-top:12px;border:1px solid var(--border);display:block}
.tk-links{display:flex;gap:8px;margin:4px 0 6px}
.tk-links a{flex:1;text-align:center;padding:11px;border-radius:11px;background:var(--surface-2);border:1px solid var(--border);font-weight:700;font-size:14px;color:var(--ink)}

.empty{text-align:center;color:var(--faint);font-size:13.5px;padding:30px 20px}
.sec-label{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:22px 0 10px}
.progress{height:6px;border-radius:3px;background:var(--border);overflow:hidden;margin-top:6px}
.progress i{display:block;height:100%;background:var(--green);border-radius:3px;transition:width .3s}
.toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%) translateY(20px);z-index:80;
  background:var(--ink);color:var(--bg);font-size:14px;font-weight:600;padding:11px 18px;border-radius:12px;
  opacity:0;transition:.3s;pointer-events:none;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
button:focus-visible,input:focus-visible,.tab:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px}
</style>

<header>
  <div class="wrap">
    <div class="head-top">
      <div class="badge"><span>澳</span></div>
      <div class="head-title">
        <b>澳門行程夥伴</b>
        <small>4 天 3 夜 · 08/27–08/30</small>
      </div>
      <button class="theme-btn" id="themeBtn" aria-label="切換深淺色">◐</button>
    </div>
    <div class="status" id="statusBar">
      <div class="dot"></div>
      <div class="s-body">
        <div class="s-label" id="stLabel">現在</div>
        <div class="s-main" id="stMain">載入行程中…</div>
      </div>
    </div>
    <div class="tabs" id="tabs" role="tablist"></div>
  </div>
</header>

<main class="wrap" id="view"></main>

<div class="footbar">
  <div class="wrap">
    <div class="foot-col">
      <div class="fl" id="footLabel">今日花費</div>
      <div class="fv"><span id="footToday">0</span><small>MOP</small></div>
      <div class="fsub" id="footTodayTwd">≈ NT$0</div>
    </div>

const store = {

  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

function curLabel(c){ return c==='TWD'?'NT$':'MOP'; }
function toTWD(amt,cur){ return cur==='TWD'?amt:amt*MOP2TWD; }
function prepaidTWD(){ return prepaid.reduce((s,p)=>s+(p.cur==='TWD'?p.amt:p.amt*MOP2TWD),0); }

/* ===================== 地圖 ===================== */
function mapURL(q){
  const tw = /桃園|TPE|台灣|停車場/.test(q);
  const dest = tw ? q : q+" 澳門 Macau";
  const mode = /停車場|機場|酒店|飯店/.test(q) ? "driving" : "walking";
  return "https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(dest)+"&travelmode="+mode;
}

/* ===================== 花費計算 ===================== */
function toMOP(amt,cur){ return cur==="MOP"?amt: amt/MOP2TWD; }
function dayMOP(idx){ return expenses.filter(e=>e.dayIdx===idx).reduce((s,e)=>s+toMOP(e.amt,e.cur),0); }
function totalMOP(){ return expenses.reduce((s,e)=>s+toMOP(e.amt,e.cur),0); }
function itemExp(di,ii){ return expenses.filter(e=>e.dayIdx===di&&e.itemIdx===ii); }

function refreshFoot(){
  const dt=dayMOP(activeTab);
  // 全程累計 = 帳本全部合計（行前機酒 ＋ 門票已購 ＋ 旅途現場），以 NT$ 為準再回推 MOP
  const grandTWD = totalMOP()*MOP2TWD + prepaidTWD() + ticketPaidTWD();
  const grandMOP = grandTWD/MOP2TWD;
  document.getElementById('footToday').textContent = money(dt);
  document.getElementById('footTotal').textContent = money(grandMOP);
  document.getElementById('footTodayTwd').textContent = "≈ NT$"+money(dt*MOP2TWD);
  document.getElementById('footTotalTwd').textContent = "≈ NT$"+money(grandTWD);
  const lbl = document.getElementById('footLabel');
  lbl.textContent = (DAYS[activeTab]?DAYS[activeTab].d:"旅途")+" 花費";
}

/* ===================== 時間工具 ===================== */
function nowMock(){ return new Date(); }
function parseItemDate(dayIdx,t){
  const d = DAYS[dayIdx].date.split('/');
  const [h,m]=t.split(':');
  return new Date(2026, +d[0]-1, +d[1], +h, +m);
}
function fmtCountdown(ms){
  if(ms<=0) return "已過";
  const min=Math.floor(ms/60000), h=Math.floor(min/60), d=Math.floor(h/24);
  if(d>0) return d+" 天 "+(h%24)+" 小時";
  if(h>0) return h+" 小時 "+(min%60)+" 分";
  return min+" 分鐘";
}
function leaveTime(r){
  const ev=new Date(r.eventISO);
  return new Date(ev.getTime()-(r.buffer+r.travel)*60000);
}
function fmtTime(dt){ return String(dt.getHours()).padStart(2,'0')+":"+String(dt.getMinutes()).padStart(2,'0'); }
function fmtDate(dt){ return (dt.getMonth()+1)+"/"+dt.getDate(); }

/* ===================== 即時狀態列 ===================== */
function updateStatus(){
  const now=nowMock();
  // 找下一個提醒的「最晚出發」
  let next=null;
  for(const r of REMINDERS){ const lv=leaveTime(r); if(lv>now){ next={r,lv}; break; } }
  const main=document.getElementById('stMain'), lab=document.getElementById('stLabel');
  const tripStart=new Date("2026-08-27T03:30");
  if(now<tripStart){
    lab.textContent="出發倒數";
    main.innerHTML="距離出發還有 <b>"+fmtCountdown(tripStart-now)+"</b>";
  }else if(next){
    lab.textContent="下一個關鍵時間";
    main.innerHTML=next.r.title.split('·')[0]+" · 最晚 <b>"+fmtDate(next.lv)+" "+fmtTime(next.lv)+"</b> 出發（"+fmtCountdown(next.lv-now)+"）";
  }else{
    lab.textContent="行程";
    main.innerHTML="祝旅途愉快 ✈️";
  }
}

/* ===================== 渲染：每日行程 ===================== */
const TAGMAP={ka:{c:"ka",x:"打卡"},must:{c:"must",x:"必訂"},book:{c:"book",x:"可先訂"},eat:{c:"eat",x:"美食"},free:{c:"free",x:"免費"}};
function renderDay(idx){
  const day=DAYS[idx]; const v=document.getElementById('view');
  const spentToday=dayMOP(idx);
  let html='<section class="day-hero"><div class="eyebrow">'+day.d+' · '+day.date+'（'+day.dow+'）</div>'
    +'<h2>'+day.theme+'</h2><p>'+day.note+'</p>'
    +'<div class="day-meta"><span class="chip">📍 '+day.items.length+' 個點</span>'
    +'<span class="chip spend">💰 已記 MOP '+money(spentToday)+'</span></div></section>';
  html+='<div class="timeline">';
  day.items.forEach((it,ii)=>{
    const key=idx+'-'+ii;
    const exps=itemExp(idx,ii);
    const logged=exps.reduce((s,e)=>s+toMOP(e.amt,e.cur),0);
    const tags=(it.tags||[]).map(t=>'<span class="t '+TAGMAP[t].c+'">'+TAGMAP[t].x+'</span>').join('');
    const isTicket = it.type==='ticket';
    let est="";
    if(it.est!=null && it.est>0) est='<div class="est">預估 <b>'+(it.estcur==='MOP'?'MOP ':'NT$')+money(it.est)+'</b>'+(it.estnote?' · '+it.estnote:'')+'</div>';
    else if(it.estnote) est='<div class="est">'+it.estnote+'</div>';

    html+='<article class="stop" id="stop-'+key+'">';
    html+='<div class="stop-main"><div class="stop-time"><b>'+it.t+'</b><div class="icon">'+it.ic+'</div></div>';
    html+='<div class="stop-body"><div class="stop-title">'+it.title+'</div>';
    if(it.note) html+='<div class="stop-note">'+it.note+'</div>';
    if(tags) html+='<div class="tags">'+tags+'</div>';
    html+=est+'</div></div>';

    // actions
    html+='<div class="acts">';
    if(it.map) html+='<a class="act nav" href="'+mapURL(it.map)+'" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s7-6.5 7-12a7 7 0 10-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>導航</a>';
    if(it.parking) html+='<a class="act" href="'+mapURL(it.parking)+'" target="_blank" rel="noopener"><b style="font-size:14px">🅿</b> 停車場</a>';
    html+='<button class="act money'+(logged>0?' has':'')+'" data-money="'+key+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>'+(logged>0?'MOP '+money(logged):'記帳')+'</button>';
    if(it.ticket){
      const tkS = tickets[key]||{}; const hasTk = tkS.url||tkImgs(tkS).length; const isFlight=!!it.ticket.flight;
      const done = isFlight ? (hasTk||tkS.pnr) : (!!tkS.booked);
      const tkLabel = isFlight ? (hasTk?'開機票':(tkS.pnr?'機票 ✓':'電子機票')) : (hasTk?'開票':(tkS.booked?'已訂 ✓':'電子票'));
      html+='<button class="act ticket'+(done?' booked':'')+'" data-ticket="'+key+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V7a2 2 0 012-2h12a2 2 0 012 2v2a2 2 0 000 6v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2a2 2 0 000-6z"/><path d="M14 5v14" stroke-dasharray="2 2"/></svg>'+tkLabel+'</button>';
    }
    html+='</div>';

    if(exps.length) html+=loggedRows(exps);
    html+='</article>';
  });
  html+='</div>';

  // 額外景點／臨時消費
  const freeExps = expenses.filter(e=>e.dayIdx===idx && (e.itemIdx===null||e.itemIdx===undefined));
  html+='<button class="add-free" data-addfree="'+idx+'">＋ 加一筆（額外景點／臨時消費）</button>';
  if(freeExps.length){
    html+='<div class="card" style="margin-top:10px"><div class="card-h" style="padding-bottom:6px"><span class="ic">🧾</span><div><h3 style="font-size:15px">這天的額外花費</h3><div class="sub">不在原規劃點上的消費</div></div></div><div class="card-b" style="padding-top:2px">'+loggedRows(freeExps,true)+'</div></div>';
  }

  v.innerHTML=html;
  bindDay();
}
function esc(s){ return String(s==null?'':s).replace(/"/g,'&quot;'); }
function loggedRows(exps,plain){
  let h= plain?'':'<div class="logged">';
  exps.forEach(e=>{
    const pm = e.pay?'<span class="pm">'+e.pay+'</span>':'';
    const place = e.place?'<b>'+e.place+'</b> · ':'';
    h+='<div class="logged-row"><span data-edit="'+e.id+'" style="cursor:pointer;min-width:0">'+place+e.cat+(e.note?' · '+e.note:'')+pm+' <span style="color:var(--blue);font-weight:700;white-space:nowrap">✎ 改</span></span>'
      +'<span class="amt">'+curLabel(e.cur)+' '+money(e.amt)+'</span>'
      +'<button data-del="'+e.id+'">刪除</button></div>';
  });
  return h + (plain?'':'</div>');
}
function bindDay(){
  document.querySelectorAll('[data-money]').forEach(b=>b.onclick=()=>openExpense(b.dataset.money));
  document.querySelectorAll('[data-ticket]').forEach(b=>b.onclick=()=>openTicket(b.dataset.ticket));
  document.querySelectorAll('[data-addfree]').forEach(b=>b.onclick=()=>openExpenseFree(+b.dataset.addfree));
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEditExpense(b.dataset.edit));
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    expenses=expenses.filter(e=>e.id!==b.dataset.del); store.set(LS.exp,expenses);
    TABS[activeTab].render(); refreshFoot(); toast("已刪除一筆花費");
  });
}

/* ===================== 記帳 sheet ===================== */
const CATS=["🍽️ 餐飲","📸 拍照費","🎫 門票","🚕 交通","🛍️ 購物","🏨 住宿","➕ 其他"];
const PAYS=["💵 現金","💳 刷卡"];
let pickCat=CATS[0], pickCur="MOP", pickPay=PAYS[0];
function openExpense(key){
  const [di,ii]=key.split('-').map(Number);
  const it=DAYS[di].items[ii];
  const preCat = it.type==='eat'?"🍽️ 餐飲": it.type==='ticket'?"🎫 門票": it.type==='shop'?"🛍️ 購物": it.type==='transport'?"🚕 交通":it.type==='flight'?"🚕 交通":"📸 拍照費";
  expenseSheet({di,ii,title:it.t+' · '+it.title, preCat, preCur:it.estcur||"MOP", showPlace:false});
}
function openExpenseFree(di){
  expenseSheet({di,ii:null,title:DAYS[di].d+' · '+DAYS[di].date+'　額外記一筆',preCat:"🛍️ 購物",preCur:"MOP",showPlace:true});
}
function openEditExpense(id){
  const e=expenses.find(x=>x.id===id); if(!e)return;
  const isFree=(e.itemIdx==null);
  const it=isFree?null:DAYS[e.dayIdx].items[e.itemIdx];
  const title=isFree?(DAYS[e.dayIdx].d+' · '+DAYS[e.dayIdx].date+'　額外花費'):(it.t+' · '+it.title);
  expenseSheet({di:e.dayIdx,ii:e.itemIdx,title,preCat:e.cat,preCur:e.cur,showPlace:isFree,edit:e});
}
function expenseSheet(o){
  const ed=o.edit||null;
  pickCat=ed?ed.cat:o.preCat; pickCur=ed?ed.cur:o.preCur; pickPay=ed?(ed.pay||PAYS[0]):PAYS[0];
  const sheet=document.getElementById('sheet');
  sheet.innerHTML='<div class="grip"></div>'
    +'<h3>'+(ed?'修改花費':'記一筆花費')+'</h3><div class="sh-sub">'+o.title+'</div>'
    +(o.showPlace?'<div class="field"><label>地點／項目</label><input class="txt-in" id="placeIn" placeholder="例如：路環安德魯、臨時買的伴手禮" value="'+esc(ed?ed.place:'')+'"></div>':'')
    +'<div class="field"><label>金額</label><div class="amt-in">'
      +'<select id="curSel"><option value="MOP">MOP 澳門幣</option><option value="TWD">NT$ 台幣</option></select>'
      +'<input id="amtIn" type="number" inputmode="decimal" placeholder="0" value="'+(ed?ed.amt:'')+'"></div></div>'
    +'<div class="field"><label>付款方式</label><div class="cats" id="payRow">'
      +PAYS.map(p=>'<button class="cat" data-pay="'+p+'" aria-pressed="'+(p===pickPay)+'">'+p+'</button>').join('')+'</div></div>'
    +'<div class="field"><label>分類</label><div class="cats" id="catRow">'
      +CATS.map(c=>'<button class="cat" data-cat="'+c+'" aria-pressed="'+(c===pickCat)+'">'+c+'</button>').join('')+'</div></div>'
    +'<div class="field"><label>備註（選填）</label><input class="txt-in" id="noteIn" placeholder="例如：拍照費、加點甜點" value="'+esc(ed?ed.note:'')+'"></div>'
    +'<button class="big-btn" id="saveExp">'+(ed?'儲存修改':'儲存花費')+'</button>'
    +(ed?'<button class="big-btn ghost" id="delExp" style="color:var(--danger);margin-top:8px">🗑 刪除這筆</button>':'');
  openSheet();
  document.getElementById('curSel').value=pickCur;
  document.getElementById('curSel').onchange=e=>pickCur=e.target.value;
  document.querySelectorAll('#payRow .cat').forEach(b=>b.onclick=()=>{
    pickPay=b.dataset.pay;
    document.querySelectorAll('#payRow .cat').forEach(x=>x.setAttribute('aria-pressed',x===b));
  });
  document.querySelectorAll('#catRow .cat').forEach(b=>b.onclick=()=>{
    pickCat=b.dataset.cat;
    document.querySelectorAll('#catRow .cat').forEach(x=>x.setAttribute('aria-pressed',x===b));
  });
  document.getElementById('saveExp').onclick=()=>{
    const amt=parseFloat(document.getElementById('amtIn').value);
    if(!amt||amt<=0){ toast("請輸入金額"); return; }
    const note=document.getElementById('noteIn').value.trim();
    if(ed){
      const place = o.showPlace ? (document.getElementById('placeIn').value.trim()||"額外") : ed.place;
      Object.assign(ed,{cat:pickCat,amt,cur:pickCur,pay:pickPay,note,place});
      store.set(LS.exp,expenses); closeSheet(); TABS[activeTab].render(); refreshFoot(); toast("已更新這筆花費");
    }else{
      const place = o.showPlace ? (document.getElementById('placeIn').value.trim()||"額外") : null;
      expenses.push({id:'e'+Date.now(),dayIdx:o.di,itemIdx:o.ii,place,cat:pickCat,amt,cur:pickCur,pay:pickPay,note,ts:Date.now()});
      store.set(LS.exp,expenses); closeSheet(); TABS[activeTab].render(); refreshFoot(); toast("已記錄 "+curLabel(pickCur)+" "+money(amt));
    }
  };
  if(ed){ document.getElementById('delExp').onclick=()=>{
    expenses=expenses.filter(x=>x.id!==ed.id); store.set(LS.exp,expenses);
    closeSheet(); TABS[activeTab].render(); refreshFoot(); toast("已刪除一筆花費");
  }; }
  setTimeout(()=>{const el=document.getElementById(o.showPlace&&!ed?'placeIn':'amtIn'); if(el)el.focus();},300);
}

/* ===================== 電子票 · 多圖工具 ===================== */
function tkImgs(t){ if(!t) return []; if(Array.isArray(t.imgs)) return t.imgs.slice(); if(t.img) return [t.img]; return []; }
function setTkImgs(key,arr){
  const t=tickets[key]||{}; const prevImgs=t.imgs, prevImg=t.img;
  t.imgs=arr; delete t.img; tickets[key]=t;
  try{ localStorage.setItem(LS.tk, JSON.stringify(tickets)); return true; }
  catch(e){ t.imgs=prevImgs; if(prevImg!==undefined)t.img=prevImg; toast("儲存空間不足，圖片太大存不下"); return false; }
}
function addTkImages(key,fileList,cb){
  const files=[...fileList].filter(f=>f&&f.type&&f.type.startsWith('image/'));
  if(!files.length){ cb&&cb(0); return; }
  const arr=tkImgs(tickets[key]); let done=0, ok=0;
  files.forEach(f=>{
    const rd=new FileReader();
    const step=()=>{ done++; if(done===files.length){ const okSave=setTkImgs(key,arr); cb&&cb(okSave?ok:-1); } };
    rd.onload=()=>{ arr.push(rd.result); ok++; step(); };
    rd.onerror=step;
    rd.readAsDataURL(f);
  });
}

function gcalDate(dt){
  // Google 日曆用 UTC；澳門/台北 UTC+8
  const u=new Date(dt.getTime()-8*3600000);
  const p=n=>String(n).padStart(2,'0');
  return u.getUTCFullYear()+p(u.getUTCMonth()+1)+p(u.getUTCDate())+"T"+p(u.getUTCHours())+p(u.getUTCMinutes())+"00Z";
}

    +'<a class="act nav" style="margin-top:12px;display:inline-flex;max-width:180px" href="'+mapURL("澳門勵庭海景酒店 Harbourview Hotel Macau")+'" target="_blank" rel="noopener">導航到酒店</a>'
    +'</div></div>';

  v.innerHTML=html;
  document.querySelectorAll('.check').forEach(c=>{
    c.onclick=()=>{
      const k=c.dataset.k; checks[k]=!checks[k]; store.set(LS.chk,checks);
      c.classList.toggle('done',checks[k]); c.querySelector('input').checked=checks[k];
      updateProgress();
    };
  });
  updateProgress();
}
function checklistCard(ic,title,sub,pfx,list){
  const done=list.filter((_,i)=>checks[pfx+i]).length;
  let h='<div class="card"><div class="card-h"><span class="ic">'+ic+'</span><div style="flex:1"><h3>'+title+'</h3>'
    +'<div class="sub">'+sub+'</div><div class="progress" data-prog="'+pfx+'"><i style="width:'+(done/list.length*100)+'%"></i></div></div>'
    +'<div style="font-family:var(--serif);font-weight:700;color:var(--green);font-size:13px" data-count="'+pfx+'">'+done+'/'+list.length+'</div></div>'
    +'<div class="card-b">';
  list.forEach((it,i)=>{
    const k=pfx+i, on=!!checks[k];
    h+='<label class="check'+(on?' done':'')+'" data-k="'+k+'"><input type="checkbox" '+(on?'checked':'')+'>'
      +'<div class="ct">'+it.t+(it.s?'<small>'+it.s+'</small>':'')+'</div></label>';
  });
  return h+'</div></div>';
}
function updateProgress(){
  [["pre",PRE_LEN],["pack",PACK_LEN]].forEach(([pfx,len])=>{
    const done=[...Array(len)].filter((_,i)=>checks[pfx+i]).length;
    const bar=document.querySelector('[data-prog="'+pfx+'"] i'); if(bar)bar.style.width=(done/len*100)+"%";
    const cnt=document.querySelector('[data-count="'+pfx+'"]'); if(cnt)cnt.textContent=done+"/"+len;
  });
}
const PRE_LEN=PRETRIP.length, PACK_LEN=PACKING.length;

/* ===================== 帳本 sheet ===================== */
function openLedger(){
  const sheet=document.getElementById('sheet');

  const byCat={}, byPay={};
  expenses.forEach(e=>{ byCat[e.cat]=(byCat[e.cat]||0)+toMOP(e.amt,e.cur); byPay[e.pay||"💵 現金"]=(byPay[e.pay||"💵 現金"]||0)+toMOP(e.amt,e.cur); });

    +'<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;opacity:.65">全部合計（含機酒＋門票）</div>'
    +'<div style="font-family:var(--serif);font-size:29px;font-weight:700">NT$'+money(grandTWD)+'</div></div>';
  html+='<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px">'
    +'<div style="flex:1;min-width:150px;background:var(--blue-soft);border-radius:13px;padding:12px 13px"><div style="font-size:10.5px;font-weight:700;color:var(--blue-ink);text-transform:uppercase;letter-spacing:.04em">行前已付</div><div style="font-family:var(--serif);font-size:20px;font-weight:700;color:var(--blue-ink)">NT$'+money(preTWD)+'</div></div>'
    +'<div style="flex:1;min-width:150px;background:var(--green-soft);border-radius:13px;padding:12px 13px"><div style="font-size:10.5px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:.04em">門票已購</div><div style="font-family:var(--serif);font-size:20px;font-weight:700;color:var(--green)">NT$'+money(tkTWD)+'</div></div>'
    +'<div style="flex:1;min-width:150px;background:var(--gold-soft);border-radius:13px;padding:12px 13px"><div style="font-size:10.5px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.04em">旅途花費</div><div style="font-family:var(--serif);font-size:20px;font-weight:700;color:var(--gold)">MOP '+money(tripMOP)+'</div><div style="font-size:11px;color:var(--muted);font-weight:600">≈ NT$'+money(tripTWD)+'</div></div></div>';

  // 行前已付款
  html+='<div class="sec-label" style="margin-top:0">行前已付款（機票＋酒店等）</div>';
  html+='<div class="card"><div class="card-b" style="padding:6px 15px 14px">';
  if(prepaid.length){
    prepaid.forEach(p=>{
      html+='<div class="logged-row" style="padding:9px 0"><span style="font-weight:600">'+p.name+'</span>'
        +'<span class="amt">'+curLabel(p.cur)+' '+money(p.amt)+'</span>'
        +'<button data-delpre="'+p.id+'">刪除</button></div>';
    });
  } else html+='<div style="font-size:13px;color:var(--muted);padding:8px 0">還沒記錄。把雄獅的機＋酒訂單金額加進來，總花費才完整。</div>';
  html+='<button class="add-free" id="addPre" style="margin-top:8px">＋ 新增行前已付款</button></div></div>';

  // 門票明細 · 實付
  html+='<div class="sec-label">門票明細 · 實付金額</div>';
  html+='<div class="card"><div class="card-b" style="padding:6px 15px 14px">';
  BOOKINGS.forEach(b=>{
    const tk=tickets[b.key]||{}; const has=tk.paid>0;
    html+='<div class="logged-row" style="padding:9px 0"><span style="min-width:0"><b style="font-weight:600">'+b.name+'</b>'
      +'<small style="display:block;color:var(--faint);font-weight:400;font-size:11.5px">估 '+b.price+'</small></span>'
      +(has?'<span class="amt" style="color:var(--green)">'+curLabel(tk.paidCur||'TWD')+' '+money(tk.paid)+'</span>'
          :'<span class="amt" style="color:var(--faint);font-weight:600">未記</span>')
      +'<button data-tkedit="'+b.key+'" style="color:var(--blue)">'+(has?'修改':'記錄')+'</button></div>';
  });
  html+='<div style="display:flex;justify-content:space-between;align-items:center;padding:11px 0 3px;border-top:2px solid var(--border);margin-top:2px"><span style="font-weight:700">門票小計</span><span style="font-weight:700;color:var(--green);font-variant-numeric:tabular-nums">NT$'+money(tkTWD)+'</span></div>';
  html+='<div class="hint" style="margin-top:8px">預訂的門票在這裡記實付；現場臨時消費才用行程頁的「記帳」，兩邊不會重複算。</div>';
  html+='</div></div>';

  // 付款方式
  if(Object.keys(byPay).length){
    html+='<div class="sec-label">旅途付款方式（幫你抓要帶多少現金）</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px">';
    ["💵 現金","💳 刷卡"].forEach(p=>{ const v=byPay[p]||0; if(v>0) html+='<div style="flex:1;min-width:90px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:10px 12px"><div style="font-size:12px;color:var(--muted);font-weight:600">'+p+'</div><div style="font-weight:700;font-variant-numeric:tabular-nums">MOP '+money(v)+'</div></div>'; });

  // 分類統計
  if(cats.length){
    html+='<div class="sec-label">分類統計</div>';
    cats.forEach(([c,v])=>{
      const pct=tripMOP>0?v/tripMOP*100:0;
      html+='<div style="margin-bottom:11px"><div style="display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px"><span>'+c+'</span><span style="font-weight:700;font-variant-numeric:tabular-nums">MOP '+money(v)+'</span></div>'
        +'<div class="progress"><i style="width:'+pct+'%;background:var(--gold)"></i></div></div>';
    });
    html+='<div class="sec-label">每日</div>';
    DAYS.forEach((d,i)=>{ const dv=dayMOP(i); if(dv>0) html+='<div style="display:flex;justify-content:space-between;font-size:14px;padding:7px 0;border-top:1px solid var(--border)"><span>'+d.d+' · '+d.date+'</span><span style="font-weight:700;font-variant-numeric:tabular-nums">MOP '+money(dv)+'</span></div>'; });
    html+='<button class="big-btn ghost" id="expCsv" style="margin-top:18px">📤 匯出花費紀錄（CSV）</button>';
  } else html+='<div class="empty">旅途還沒有花費紀錄。<br>在行程每個點按「記帳」，或用每天下面的「＋ 加一筆」。</div>';

  sheet.innerHTML=html; openSheet();
  const csv=document.getElementById('expCsv'); if(csv)csv.onclick=exportCSV;
  document.getElementById('addPre').onclick=openPrepaid;
  document.querySelectorAll('[data-delpre]').forEach(b=>b.onclick=()=>{
    prepaid=prepaid.filter(p=>p.id!==b.dataset.delpre); store.set(LS.prepaid,prepaid);
    openLedger(); refreshFoot(); toast("已刪除");
  });
  document.querySelectorAll('[data-tkedit]').forEach(b=>b.onclick=()=>openTicket(b.dataset.tkedit));
}
function openPrepaid(){
  const sheet=document.getElementById('sheet');
  let curP="TWD";
  sheet.innerHTML='<div class="grip"></div><h3>新增行前已付款</h3><div class="sh-sub">出發前就付掉的費用，例如機票、酒店、保險、eSIM</div>'
    +'<div class="field"><label>項目名稱</label><input class="txt-in" id="preName" placeholder="例如：機票＋酒店（雄獅）"></div>'
    +'<div class="cats" style="margin-bottom:14px"><button class="cat" id="qMachie" aria-pressed="false">✈️🏨 機票＋酒店</button><button class="cat" id="qIns" aria-pressed="false">🛡️ 保險</button><button class="cat" id="qSim" aria-pressed="false">📶 eSIM</button></div>'
    +'<div class="field"><label>金額</label><div class="amt-in">'
      +'<select id="preCur"><option value="TWD">NT$ 台幣</option><option value="MOP">MOP 澳門幣</option></select>'
      +'<input id="preAmt" type="number" inputmode="decimal" placeholder="0"></div></div>'

  openSheet();

  document.getElementById('qMachie').onclick=()=>nameEl.value="機票＋酒店（雄獅）";
  document.getElementById('qIns').onclick=()=>nameEl.value="旅遊平安險＋班機延誤險";
  document.getElementById('qSim').onclick=()=>nameEl.value="eSIM／上網卡";
  document.getElementById('preCur').onchange=e=>curP=e.target.value;

    const amt=parseFloat(document.getElementById('preAmt').value);

function exportCSV(){
  let rows=[["日","時間","地點","分類","付款","幣別","金額","備註"]];
  prepaid.forEach(p=>rows.push(["行前","","（已付）"+p.name,"機酒/行前","",p.cur,p.amt,""]));
  BOOKINGS.forEach(b=>{ const tk=tickets[b.key]||{}; if(tk.paid>0) rows.push(["門票","",b.name,"🎫 門票","",tk.paidCur||"TWD",tk.paid,"實付"]); });
  expenses.slice().sort((a,b)=>a.dayIdx-b.dayIdx||((a.itemIdx??99)-(b.itemIdx??99))).forEach(e=>{
    const it=(e.itemIdx!=null)?DAYS[e.dayIdx].items[e.itemIdx]:null;
    const t=it?it.t:""; const name=it?it.title:(e.place||"額外");
    rows.push([DAYS[e.dayIdx].date,t,name,e.cat,e.pay||"",e.cur,e.amt,e.note||""]);
  });
  const csv="﻿"+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(",")).join("\n");
  const blob=new Blob([csv],{type:"text/csv"});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download="澳門花費.csv"; a.click();
  toast("已匯出 CSV");
}

/* ===================== 通知 ===================== */
function requestNotif(){
  if(!("Notification" in window)){ toast("此瀏覽器不支援通知"); return; }
  Notification.requestPermission().then(p=>{
    if(p==="granted"){ store.set(LS.remOn,true); toast("已開啟 · App 開著時到點會提醒"); scheduleNotifs(); }
    else toast("未授權通知");
  });
}
let notifTimers=[];
function scheduleNotifs(){
  notifTimers.forEach(clearTimeout); notifTimers=[];
  if(!store.get(LS.remOn,false) || Notification.permission!=="granted") return;
  const now=Date.now();
  REMINDERS.forEach(r=>{
    const lv=leaveTime(r).getTime();
    [{at:lv-30*60000,msg:"30 分鐘後該出發"},{at:lv,msg:"該出發了！"}].forEach(x=>{
      const delay=x.at-now;
      if(delay>0 && delay<24*3600000*6){
        notifTimers.push(setTimeout(()=>{ try{new Notification("⏰ "+r.title,{body:x.msg+" · 最晚 "+fmtTime(leaveTime(r))+" 出發"});}catch(e){} }, delay));
      }
    });
  });
}

/* ===================== Sheet / Toast 基礎 ===================== */
function openSheet(){ document.getElementById('scrim').classList.add('open'); document.body.style.overflow='hidden'; }
function closeSheet(){ document.getElementById('scrim').classList.remove('open'); document.body.style.overflow=''; }
document.getElementById('scrim').onclick=e=>{ if(e.target.id==='scrim') closeSheet(); };
let toastT;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1900); }

/* ===================== 主題 ===================== */
function applyTheme(t){ if(t) document.documentElement.setAttribute('data-theme',t); else document.documentElement.removeAttribute('data-theme'); }
(function initTheme(){ const t=store.get(LS.theme,null); applyTheme(t); })();
document.getElementById('themeBtn').onclick=()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const isDark = cur==='dark' || (!cur && matchMedia('(prefers-color-scheme:dark)').matches);
  const next=isDark?'light':'dark'; applyTheme(next); store.set(LS.theme,next);
};

/* ===================== 啟動 ===================== */
document.getElementById('ledgerBtn').onclick=openLedger;
renderTabs(); renderDay(0); refreshFoot(); updateStatus();
setInterval(updateStatus,30000);
if(store.get(LS.remOn,false)) scheduleNotifs();
